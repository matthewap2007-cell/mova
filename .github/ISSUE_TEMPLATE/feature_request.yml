name: Feature request
description: Suggest a format, tool or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Mova to do?
      placeholder: e.g. Convert MOV to GIF, or batch-rename results
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: How would you use it?
