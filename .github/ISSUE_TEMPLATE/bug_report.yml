name: Bug report
description: Something in Mova doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please **don't attach private files**; a description of the file type is usually enough.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: I dragged a 4K MOV, tapped Shift and dropped it on MP3. Expected an MP3 next to it, got “…has no audio track”.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Drag …
        2. Tap Shift …
        3. Drop on …
  - type: input
    id: file-type
    attributes:
      label: File type(s) involved
      placeholder: e.g. HEIC from iPhone 15, 120-page scanned PDF, MKV with two audio tracks
  - type: textarea
    id: environment
    attributes:
      label: Diagnostics
      description: Menu bar icon → Help & Feedback → Copy Diagnostics, then paste here. (Filled in automatically if you used “Report a Bug…”.)
      render: text
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording (optional)
